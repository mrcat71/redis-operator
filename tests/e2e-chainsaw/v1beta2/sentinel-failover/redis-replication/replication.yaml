---
# The embedded Sentinel has no password, the default. The preStop hook still
# sends the Redis password from REDISCLI_AUTH, which redis-cli answers with an
# "AUTH failed" warning on stderr before running the command.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: redis-replication-failover
spec:
  clusterSize: 3
  kubernetesConfig:
    image: quay.io/opstree/redis:latest
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: redis-secret
      key: password
  sentinel:
    size: 3
    image: quay.io/opstree/redis-sentinel:latest
    imagePullPolicy: IfNotPresent
